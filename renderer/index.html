<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>A/R Desktop Suite</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container">

<h1>Accounts Receivable Desktop Suite</h1>

<div class="card">

<label>Input Folder</label>

<div class="row">

<input id="inputFolder" readonly>

<button id="browseInput">Browse</button>

</div>

<label>Output Folder</label>

<div class="row">

<input id="outputFolder" readonly>

<button id="browseOutput">Browse</button>

</div>

<label>Date Range</label>

<input
id="dateRange"
placeholder="5/2026,6/2026,7/2026">

<div class="checks">

<label>

<input
type="checkbox"
checked
id="keepFiles">

Keep formatted spreadsheets

</label>

<label>

<input
type="checkbox"
checked
id="generatePdf">

Generate PDFs

</label>

<label>

<input
type="checkbox"
checked
id="openFolder">

Open output folder when finished

</label>

</div>

<button
id="startButton">

Start Processing

</button>

</div>

<div class="card">

<h3>Status</h3>

<progress
id="progress"
value="0"
max="100">
</progress>

<p id="status">

Waiting...

</p>

<pre id="log"></pre>

</div>

</div>

<script src="renderer.js"></script>

</body>

</html>
